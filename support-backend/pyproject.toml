[project]
name = "support-backend"
version = "1.0.0"
description = "FastAPI backend for the Support Ticket System"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "supabase==2.7.4",
    "boto3==1.35.19",
    "httpx==0.27.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "psycopg[binary]==3.2.1",
    "ruff==0.6.8",
    "mypy==1.11.2",
    "coverage==7.6.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["B008"]  # Allow Depends() in function defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
