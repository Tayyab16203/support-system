version: "3.8"

services:
  backend:
    build:
      context: ./support-backend
      dockerfile: Dockerfile
    container_name: support-backend
    ports:
      - "8000:8000"
    env_file:
      - ./support-backend/.env
    environment:
      - APP_ENV=development
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./support-backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./support-frontend
      dockerfile: Dockerfile
    container_name: support-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./support-frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
